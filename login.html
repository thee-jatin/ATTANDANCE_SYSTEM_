<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #16a34a;
}

.login-box {
    width: 350px;
    padding: 30px;
    background: white;
    border-radius: 12px;
    text-align: center;
}

/* Original Jatin & Anshul Logo */
.logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: contain;
    background: #171717;
    margin-bottom: 15px;
}
h2 {
    color: #166534;
    margin: 5px 0 8px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
}

.login-btn {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: none;
    border-radius: 7px;
    background: #16a34a;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background: #15803d;
}

.forgot {
    display: block;
    margin-top: 18px;
    color: #15803d;
    text-decoration: none;
    font-size: 14px;
}

.credit {
    margin-top: 28px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
    color: #64748b;
    font-size: 13px;
}

.credit strong {
    color: #166534;
}
</style>
</head>

<body>

<div class="login-box">

    <img src="logo.jpeg" class="logo" alt="Jatin & Anshul Logo">

    <h2>Attendance Manager</h2>

    <p class="subtitle">
        Sign in to your class attendance
    </p>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
            required>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <a href="#" class="forgot" id="forgotPassword">
        Forgot Password?
    </a>

    <div class="credit">
        Powered by <strong>Jatin &amp; Anshul</strong>
    </div>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Login page ready! Backend connection required.");

});

document.getElementById("forgotPassword")
.addEventListener("click", function(event) {

    event.preventDefault();

    alert("Please contact your administrator.");

});

</script>

</body>
</html>
